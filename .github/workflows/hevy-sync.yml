name: hevy-sync
on:
  schedule:
    - cron: "*/30 11-23,0-5 * * *"   # every 30 min, 5am–11pm Mexico City
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to Hevy (1) or dry run (0)"
        default: "1"
permissions:
  contents: write
concurrency: hevy-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node src/run.js run
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          APPLY: ${{ github.event.inputs.apply || vars.APPLY || '0' }}
      - name: Save state
        run: |
          git config user.name "hevy-sync"; git config user.email "hevy-sync@users.noreply.github.com"
          git add state.json; git diff --cached --quiet || (git commit -m "state: new workouts" && git push)
